# HTTPS in front of the test server: TLS on 7473, Neo4j's plain HTTP behind it.
global
  log stdout format raw local0

defaults
  mode tcp
  timeout connect 10s
  timeout client 1h
  timeout server 1h

frontend https
  bind :7473 ssl crt /usr/local/etc/haproxy/server.pem
  default_backend neo4j

backend neo4j
  server neo4j neo4j:7474
