# The tests' servers: Neo4j 5.26 (an LTS release, the community image), its HTTP Query API on
# 17474 (user `neo4j`, password `spelaion-test`), and the same behind TLS on 17473 (a
# certificate for neo4j.spelaion.test signed by keys/ca.crt, from testing/gen-keys.sh).
name: spelaion-plugin-neo4j

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/spelaion-test
    ports:
      - "127.0.0.1:17474:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 3s
      retries: 60

  tls:
    image: haproxy:3.2-alpine
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:17473:7473"
    volumes:
      - ./tls/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./keys/server.pem:/usr/local/etc/haproxy/server.pem:ro
