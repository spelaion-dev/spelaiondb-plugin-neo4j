# What every pull request and every push to `main` must pass: the checks every plugin of
# SpelaionDB shares, kept in the template's repository and called by commit. A change there
# reaches this plugin when this file moves the commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: spelaion-dev/spelaiondb-plugin-template/.github/workflows/plugin-ci.yml@c0d8acc38a620dd38efe553c68fe071590fa29a3
    with:
      # Where ci/services.sh put the servers: Neo4j's HTTP Query API, and the same behind TLS.
      # On Windows there is none: the tests that need them are skipped there, saying so.
      test-env: |
        SPELAION_TEST_NEO4J=127.0.0.1:17474
        SPELAION_TEST_NEO4J_TLS=127.0.0.1:17473
